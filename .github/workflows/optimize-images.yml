name: Optimize website images
on:
  push:
    paths:
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Create lightweight WebP files and update HTML references
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import re
          files = [
            'e56312430c6da569.jpg',
            'c50ce797d4578aec.jpg',
            'd9f66b75c561bd12.png',
            'a9d28378b1579504.png',
            'cc373d29bd159e4a.png',
          ]
          for filename in files:
              source = Path('assets') / filename
              if not source.exists():
                  raise FileNotFoundError(source)
              dest = source.with_suffix('.webp')
              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image)
                  image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  if image.mode not in ('RGB','RGBA'):
                      image = image.convert('RGBA' if 'A' in image.getbands() else 'RGB')
                  image.save(dest, 'WEBP', quality=83, method=6)
              print(f'{source}: {source.stat().st_size} -> {dest}: {dest.stat().st_size}')
          n = 0
          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts:
                  continue
              original = page.read_text(encoding='utf-8')
              changed = original
              for filename in files:
                  changed = changed.replace('assets/' + filename, 'assets/' + Path(filename).with_suffix('.webp').name)
              if changed != original:
                  page.write_text(changed, encoding='utf-8')
                  n += 1
          print(f'Updated {n} HTML files')
          PY
      - name: Optimize externally hosted menu photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from urllib.request import urlopen
          from io import BytesIO
          import re
          urls=set()
          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts: continue
              urls.update(re.findall(r'https://static[.]wixstatic[.]com/media/[A-Za-z0-9_~.%-]+',page.read_text(encoding='utf-8')))
          changes={}
          for url in sorted(urls):
              try:
                  raw=urlopen(url,timeout=45).read()
                  with Image.open(BytesIO(raw)) as im:
                      im=ImageOps.exif_transpose(im)
                      im.thumbnail((1100,1100),Image.Resampling.LANCZOS)
                      if im.mode not in ('RGB','RGBA'): im=im.convert('RGB')
                      dest=Path('assets')/('wix_'+url.rsplit('/',1)[-1].split('~')[0]+'.webp')
                      im.save(dest,'WEBP',quality=82,method=6)
                      changes[url]=(dest.as_posix(),im.width,im.height)
                  print('Converted',dest,len(raw),dest.stat().st_size)
              except Exception as e:
                  print('Skipped',url,repr(e))
          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts: continue
              old=page.read_text(encoding='utf-8')
              new=old
              for url,(dest,w,h) in changes.items():
                  new=re.sub(r'src="'+re.escape(url)+r'"(?: width="[0-9]+" height="[0-9]+")?',f'src="{dest}" width="{w}" height="{h}"',new)
              if old!=new: page.write_text(new,encoding='utf-8')
          PY
      - name: Commit optimized assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'assets/*.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Optimize large website images as WebP without layout changes"
            git push
          fi

/* close-mobile-menu-on-scroll */
(() => {
  let lastY = window.scrollY;
  const closeMobileMenu = () => {
    const nav = document.querySelector('.mobile-nav');
    if (!nav || !nav.classList.contains('open')) return;
    nav.classList.remove('open');
    const btn = document.querySelector('.menu-btn');
    if (btn) btn.setAttribute('aria-expanded','false');
  };
  window.addEventListener('scroll', () => {
    if (Math.abs(window.scrollY - lastY) > 2) closeMobileMenu();
    lastY = window.scrollY;
  }, { passive: true });
})();
</script><script>
/* GA4 conversion click tracking */
(() => {
  const destinationStore = (href) => {
    if (href.includes('13286293') || href.includes('0364522345') || href.includes('03-6452-2345')) return '中目黒';
    if (href.includes('13302209') || href.includes('0362773390') || href.includes('03-6277-3390')) return '東五反田';
    if (href.includes('13318684') || href.includes('0364173302') || href.includes('03-6417-3302')) return '西五反田';
    return '';
  };

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (!a || typeof gtag !== 'function') return;

    const href = a.getAttribute('href') || '';
    const absoluteHref = a.href || href;
    const params = {
      link_url: absoluteHref,
      link_text: (a.textContent || '').trim().slice(0, 100),
      destination_store: destinationStore(href)
    };

    if (href.startsWith('tel:')) {
      gtag('event', 'phone_click', params);
    } else if (href.includes('yoyaku.tabelog.com')) {
      gtag('event', 'reservation_click', params);
    }
  });
})();
</script>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ニュースリリース｜もんじゃ駒と</title>
<meta name="description" content="もんじゃ駒とのニュースリリースページです。">
<style>:root{--bg:#f8f4ec;--paper:#fffdf8;--ink:#2e2924;--sub:#776d64;--line:#d9c6a4;--terracotta:#a84f3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.85}a{color:inherit}.wrap{width:min(980px,calc(100% - 36px));margin:auto}
header{background:rgba(248,244,236,.96);border-bottom:1px solid rgba(182,151,91,.2)}.nav{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:auto;height:74px;max-height:74px;object-fit:contain}.back{padding:10px 16px;border-radius:999px;background:#eee4d7;text-decoration:none;font-weight:800;font-size:13px}
.hero{padding:78px 0 34px}.kicker{font-size:11px;letter-spacing:.18em;font-weight:900;color:#9d6e55}.hero h1{margin:6px 0 14px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,6vw,64px);line-height:1.2}.hero p{margin:0;color:var(--sub)}
.content{padding:20px 0 90px}.card{background:var(--paper);border:1px solid rgba(182,151,91,.22);border-radius:24px;padding:30px;box-shadow:0 12px 34px rgba(64,46,32,.06);margin-bottom:18px}.card h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;margin:0 0 18px;font-size:25px}.card p{margin:0;color:var(--sub)}
footer{padding:30px 0 46px;border-top:1px solid rgba(182,151,91,.18);color:#111;font-size:12px}
@media(max-width:900px){.logo{width:auto;height:62px;max-height:62px}}@media(max-width:640px){.card{padding:22px}.nav{min-height:72px}}
/* === mobile optimization 2026-10-08 === */
@media(max-width:700px){
  .wrap{width:min(100% - 28px,980px)}
  .nav{min-height:72px;padding:5px 0}
  .logo{height:62px;max-height:62px;width:auto}
  .back{min-height:44px;display:flex;align-items:center;justify-content:center;padding:9px 13px;font-size:12px}
  .hero{padding:42px 0 22px}
  .hero h1{font-size:clamp(34px,9.5vw,44px);line-height:1.25;margin:6px 0 12px}
  .hero p{font-size:14px;line-height:1.8}
  .content{padding:8px 0 64px}
  .card{padding:20px 18px;border-radius:18px;margin-bottom:14px}
  .card h2{font-size:24px;line-height:1.45}
  .card h3{font-size:17px;line-height:1.6;margin:20px 0 6px}
  .card p,.company-dl{font-size:14px}
  .company-dl{grid-template-columns:1fr;gap:3px}
  .company-dl dt{margin-top:10px}
  .company-dl dd{margin-bottom:8px}
  footer{padding:24px 0 34px}
}
</style></head>
<body><header><div class="wrap nav"><a href="./"><img class="logo" src="assets/6d7f3ca368181aa7.png" alt="もんじゃ駒と"></a><a class="back" href="./">TOPへ戻る</a></div></header>
<main><section class="hero wrap"><div class="kicker">NEWS RELEASE</div><h1>ニュースリリース</h1><p>もんじゃ駒とからのお知らせを掲載します。</p></section>
<section class="content wrap"><div class="card"><h2>ニュースリリースは順次公開予定です。</h2><p>新店舗、サービス、キャンペーンなどのお知らせを今後こちらでご案内します。</p></div></section></main>
<footer><div class="wrap">© MONJA KOMATO / SUMIKOMA Inc.</div></footer></body></html>
